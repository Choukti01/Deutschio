[build]
  command = "npm run build:api && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # The production runtime uses NODE_ENV=production, but Vite and TypeScript
  # are build-time dev dependencies and must be installed in Netlify's builder.
  NPM_CONFIG_INCLUDE = "dev"

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express"]
